name: Translate
on:
  workflow_call:
    inputs:
      pypy_version:
        required: false
        type: string
        default: "pypy-2.7-v7.3.17"

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.pypy_version }}

      - run: git clone --depth=1 https://github.com/pypy/pypy.git

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pypy/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev pkg-config zlib1g-dev libbz2-dev libsqlite3-dev libncurses5-dev libexpat1-dev libssl-dev libgdbm-dev tk-dev libgc-dev liblzma-dev libncursesw5-dev patchelf
          pypy -m pip install -r pypy/requirements.txt

      - env:
          PLTHOME: ${{ github.workspace }}
        run: make pycket-c-linklets

